name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          STATIC_EXPORT: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Locate build output
        id: out
        run: |
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then echo "dir=$d" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "Could not find a build output directory containing index.html" >&2
          ls -R .output dist 2>/dev/null | head -50
          exit 1

      - name: Add Pages fallbacks
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          touch "$DIR/.nojekyll"
          [ -f "$DIR/404.html" ] || cp "$DIR/index.html" "$DIR/404.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
